# g2-ring-remote settings. Lives on the phone at /data/local/tmp/g2-ring-remote/g2-ring-remote.conf;
# edit it, push with `./g2-ring-remote.sh push-config g2-ring-remote.conf`, then `./g2-ring-remote.sh restart`.
# Every line is optional; these are the defaults.

# Which input devices to grab: the name, or the name followed by a space and more
# ("K02 Consumer Control"). Set match.uniq to the ring's Bluetooth address to
# ignore any other device with the same name.
match.name=K02
#match.uniq=aa:bb:cc:dd:ee:ff

# A second remote: device.NAME.SETTING adds a profile with its own grab, map and
# timing. Its map starts empty (the map below is not inherited); every other setting
# falls back to the top-level value unless set here. A node is grabbed by the first
# profile that matches it. The CMF Watch Pro 2 appears as a separate Classic
# Bluetooth HID device named "<Bluetooth name> Consumer Control"; set match.name to
# the full Bluetooth name (it ends in the last four hex digits of the watch's address).
#device.watch.match.name=CMF Watch Pro 2-XXXX
#device.watch.match.uniq=aa:bb:cc:dd:ee:ff
#device.watch.faceclaw.source=watch
# The watch sends no auto-repeat, so a short window drops only bounced presses.
#device.watch.key.repeat-window-ms=150
#device.watch.map.key.VOLUMEUP=scroll-up
#device.watch.map.key.CODE_0x195=scroll-down
#device.watch.map.key.PLAYPAUSE=click
#device.watch.map.key.CODE_0xa8=double-click
#device.watch.map.key.NEXTSONG=long-press
#device.watch.map.key.PREVIOUSSONG=short-then-long-press
#device.watch.map.key.MUTE=voice-toggle
# Touchscreen swipes arrive as two keys in one report (LAST = CODE_0x195 plus one
# other). Mapping any key.A+B makes the profile read keys per report.
#device.watch.map.key.CODE_0x195+VOLUMEUP=swipe-up
#device.watch.map.key.CODE_0x195+MUTE=swipe-down
#device.watch.map.key.CODE_0x195+PREVIOUSSONG=swipe-left
#device.watch.map.key.CODE_0x195+NEXTSONG=swipe-right
# VOLUMEDOWN is the watch's camera shutter. Re-inject it into Android so the phone
# camera still takes a photo; the name must be KEYCODE_[A-Z0-9_]+.
#device.watch.map.key.VOLUMEDOWN=android:KEYCODE_VOLUME_DOWN
# Typed text: the on-watch keyboard sends each keystroke as REWIND plus the bits of
# one ASCII byte (0x80|c, c = 0x08 backspace or 0x20..0x7e). REWIND alone stays the
# double-click above; REWIND with any other key is sent to Faceclaw as typed text,
# never as a gesture. The token needs the "Text to foreground window" permission.
#device.watch.text.enabled=true

faceclaw.host=127.0.0.1
faceclaw.port=8791
# "watch" enables directional swipes; "ring" cannot send them.
faceclaw.source=watch
# A Faceclaw input token with only "Provide input". Readable by the shell user only.
token.file=/data/local/tmp/g2-ring-remote/token

# Below this movement (screen range 0-1000) a touch is a tap rather than a swipe.
touch.tap-threshold=100
# The K02 repeats a held key every ~390 ms. Repeats within this window are dropped
# for every gesture except scroll-up/scroll-down, so holding back or menu fires once.
key.repeat-window-ms=600

# Ring events -> Faceclaw gestures (or "none").
#
# touch.* are the K02's short presses: a scripted swipe, named by the direction the
# *finger* travels, or a tap for the center. The K02 drags the finger opposite to
# the button (the down button swipes up), so each direction maps to its opposite.
# If a D-pad button moves the wrong way in Faceclaw, swap the two gestures here.
# key.* are long presses, named after the key the ring sends (see `g2-ring-remote.sh logs`).
#
# Gestures: click, double-click, long-press, short-then-long-press, scroll-up,
# scroll-down, swipe-up, swipe-down, swipe-left, swipe-right, voice-toggle.
# A value of android:KEYCODE_NAME re-injects that key into Android instead of
# sending a gesture (e.g. android:KEYCODE_VOLUME_DOWN).
# In Faceclaw's watch scheme, swipes navigate grids and menus spatially; elsewhere
# up/down scroll, right selects and left goes back. double-click is back, and it is
# the only gesture that wakes a sleeping or locked display. long-press is the
# system menu; short-then-long-press is the current app's menu.
map.touch.up=swipe-down
map.touch.down=swipe-up
map.touch.left=swipe-right
map.touch.right=swipe-left
map.touch.tap=click
map.key.PLAYPAUSE=double-click
map.key.NEXTSONG=long-press
map.key.PREVIOUSSONG=short-then-long-press
# The K02 camera shutter sends VOLUMEUP. Tap once to start speaking, again to stop.
# This also replaces scroll-up on the held up direction key, which sends VOLUMEUP too.
map.key.VOLUMEUP=voice-toggle
map.key.VOLUMEDOWN=scroll-down

# Deepgram speech-to-text for Faceclaw. g2-ring-remote serves an OpenAI-style transcription
# API on 127.0.0.1; in Faceclaw set the voice provider to "Whisper server" with URL
# http://127.0.0.1:8004/v1 and leave the model empty (or nova-3). Each recording goes to
# Deepgram's /v1/listen with the key in stt.key-file (read per request; transcripts are
# never logged). stt.language applies when Faceclaw sends none; "multi" = multilingual.
# stt.local-key, if set, must match Faceclaw's "Whisper server API key" field, so other
# apps on the phone cannot spend your Deepgram credit through this port.
stt.enabled=true
stt.port=8004
stt.key-file=/data/local/tmp/g2-ring-remote/deepgram-key
stt.model=nova-3
stt.language=en
#stt.local-key=
